# Java 22+ requires explicit native access for Gradle's native-platform library.
org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=true
android.r8.optimizedResourceShrinking=true
android.builtInKotlin=false
android.newDsl=false
